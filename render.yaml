services:
  - type: web
    name: controle-financas-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TRUST_PROXY
        value: 1
      # Secret supplied in the Render Dashboard. Never commit its value.
      - key: GEMINI_API_KEY
        sync: false
      # Use current models that are available to new Gemini API projects. The
      # backend tries them in order when a model is temporarily unavailable.
      - key: GEMINI_MODELS
        value: gemini-3.8-flash,gemini-3.5-flash-lite
