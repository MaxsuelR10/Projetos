services:
  - type: web
    name: controle-financas-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      # Secret supplied in the Render Dashboard. Never commit its value.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5
